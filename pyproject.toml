[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raisemap"
version = "0.1.0"
description = "Work out which exceptions a Python function can actually raise, check the docstrings say so, and catch it in CI when that changes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Avi Seth", email = "avi@crispa.ai" }]
keywords = ["exceptions", "static-analysis", "docstrings", "api", "ci", "linting", "type-safety"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = ["tomli>=2.0; python_version<'3.11'"]

[project.urls]
Homepage = "https://github.com/aviseth/raisemap"
Repository = "https://github.com/aviseth/raisemap"
Changelog = "https://github.com/aviseth/raisemap/blob/main/CHANGELOG.md"
Issues = "https://github.com/aviseth/raisemap/issues"

[project.scripts]
raisemap = "raisemap.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.7", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/raisemap"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PTH", "C4"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
